name: CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Install backend dependencies
        working-directory: backend
        run: npm install

      - name: Run backend tests
        working-directory: backend
        run: npm test -- --runInBand

      - name: Run frontend build
        working-directory: frontend
        run: npm run build

      - name: Build Docker images
        if: github.event_name == 'push'
        run: docker build -t travel-portal-backend ./backend && docker build -t travel-portal-frontend ./frontend

      - name: Deploy (optional)
        if: github.event_name == 'push' && secrets.RENDER_API_KEY != ''
        run: echo "Deployment would run here with Render or other provider"
